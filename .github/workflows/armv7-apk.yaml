name: armv7-apk
on:
  workflow_dispatch:
    inputs:
      neon:
        description: 'Activar NEON'
        type: boolean
        default: false
      modo_arm:
        description: 'Compilar en modo ARM (no Thumb)'
        type: boolean
        default: false
      diagnostico:
        description: 'APK de diagnostico (perfilador). SOLO para pruebas locales: no usar online ni publicar'
        type: boolean
        default: false

      perflog:
        description: 'Registro de rendimiento en game_log.txt (sin pantalla de perfilador)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias y SDK
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3 libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev g++ zip unzip wget apksigner
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
          unzip -q tools.zip && rm tools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          echo "sdk.dir=$HOME/android-sdk" > $GITHUB_WORKSPACE/platform/local.properties

      - name: Compilar bibliotecas armeabi-v7a
        run: |
          set -e
          W=$GITHUB_WORKSPACE
          NDK=$ANDROID_NDK_ROOT
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          mkdir -p $W/lib/lua/android/armeabi-v7a $W/lib/coopnet/android/armeabi-v7a $W/lib/sdl2/android/armeabi-v7a
          mkdir -p $HOME/w && cd $HOME/w

          # Lua
          wget -q https://www.lua.org/ftp/lua-5.3.5.tar.gz && tar xf lua-5.3.5.tar.gz
          (cd lua-5.3.5/src && make liblua.a CC="$TC/armv7a-linux-androideabi24-clang" \
            AR="$TC/llvm-ar rcu" RANLIB="$TC/llvm-ranlib" \
            MYCFLAGS="-DLUA_USE_POSIX -O2 -fPIC" MYLIBS="" && \
            cp liblua.a $W/lib/lua/android/armeabi-v7a/)

          # libjuice + coopnet
          git clone -q --depth 1 --branch v1.6.2 https://github.com/paullouisageneau/libjuice.git
          cmake -S libjuice -B jbuild -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-24 -DBUILD_SHARED_LIBS=OFF \
            -DNO_TESTS=ON -DNO_SERVER=ON -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build jbuild -j$(nproc) > /dev/null
          git clone -q --depth 1 https://github.com/coop-deluxe/coopnet.git
          python3 - << 'PYEOF'
          import pathlib
          h = pathlib.Path('coopnet/common/mpacket.hpp'); t = h.read_text()
          assert 'std::size_t hash;' in t and 'mVoidDataSize - sizeof(std::size_t)' in t
          t = t.replace('std::size_t hash;', 'uint64_t hash;').replace('mVoidDataSize - sizeof(std::size_t)', 'mVoidDataSize - sizeof(uint64_t)')
          h.write_text(t)
          c = pathlib.Path('coopnet/common/client.cpp'); s = c.read_text()
          old = '    mConnection->Begin(nullptr);\n'
          assert old in s
          s = s.replace(old, old + '    LOG_INFO("INFO packet: sizeof %d, hash %llx", (int) sizeof(MPacketInfoData), (unsigned long long) hashFile());\n', 1)
          c.write_text(s)
          PYEOF
          (cd coopnet && make lib CXX="$TC/armv7a-linux-androideabi24-clang++" \
            CXXFLAGS="-Wno-unused-function -std=c++11 -fPIC -DJUICE_STATIC -O2" LIBS="" && \
            $TC/llvm-ar rcs bin/libcoopnet.a bin/o/common/*.o && \
            cp bin/libcoopnet.a $W/lib/coopnet/android/armeabi-v7a/)
          cp $(find jbuild -name '*.a' | head -1) $W/lib/coopnet/android/armeabi-v7a/libjuice.a

          # SDL2
          git clone -q --depth 1 --branch release-2.28.1 https://github.com/libsdl-org/SDL.git
          cd SDL
          grep -rl "ALooper_pollAll" src | xargs sed -i 's/ALooper_pollAll/ALooper_pollOnce/g'
          python3 - << 'EOF'
          import pathlib
          h = pathlib.Path('include/SDL_system.h'); t = h.read_text()
          decl = 'extern DECLSPEC const char * SDLCALL SDL_AndroidGetExternalStoragePath(void);'
          assert decl in t
          t = t.replace(decl, decl + '\nextern DECLSPEC const char * SDLCALL SDL_AndroidGetTopExternalStoragePath(void);\nextern DECLSPEC void SDLCALL SDL_AndroidCopyAssetFilesToDir(const char *destpath);')
          h.write_text(t)

          c = pathlib.Path('src/core/android/SDL_android.c'); s = c.read_text()
          marker = 'const char *SDL_AndroidGetExternalStoragePath(void)\n{'
          assert marker in s
          code = '''const char *SDL_AndroidGetTopExternalStoragePath(void)
          {
              static char *s_TopExternalPath = NULL;
              if (s_TopExternalPath == NULL) {
                  struct LocalReferenceHolder refs = LocalReferenceHolder_Setup(__FUNCTION__);
                  jclass envClass;
                  jmethodID mid;
                  jobject fileObject;
                  jstring pathString;
                  const char *path;
                  JNIEnv *env = Android_JNI_GetEnv();
                  if (!LocalReferenceHolder_Init(&refs, env)) {
                      LocalReferenceHolder_Cleanup(&refs);
                      return NULL;
                  }
                  envClass = (*env)->FindClass(env, "android/os/Environment");
                  mid = (*env)->GetStaticMethodID(env, envClass, "getExternalStorageDirectory", "()Ljava/io/File;");
                  fileObject = (*env)->CallStaticObjectMethod(env, envClass, mid);
                  if (!fileObject) {
                      SDL_SetError("Couldn't get top external directory");
                      LocalReferenceHolder_Cleanup(&refs);
                      return NULL;
                  }
                  mid = (*env)->GetMethodID(env, (*env)->GetObjectClass(env, fileObject), "getAbsolutePath", "()Ljava/lang/String;");
                  pathString = (jstring)(*env)->CallObjectMethod(env, fileObject, mid);
                  path = (*env)->GetStringUTFChars(env, pathString, NULL);
                  s_TopExternalPath = SDL_strdup(path);
                  (*env)->ReleaseStringUTFChars(env, pathString, path);
                  LocalReferenceHolder_Cleanup(&refs);
              }
              return s_TopExternalPath;
          }

          void SDL_AndroidCopyAssetFilesToDir(const char *destpath)
          {
              JNIEnv *env = Android_JNI_GetEnv();
              jmethodID mid;
              jstring jdest;
              if (!env || !destpath) {
                  return;
              }
              mid = (*env)->GetStaticMethodID(env, mActivityClass, "copyAssetFilesToDir", "(Ljava/lang/String;)V");
              if (!mid) {
                  (*env)->ExceptionClear(env);
                  return;
              }
              jdest = (*env)->NewStringUTF(env, destpath);
              (*env)->CallStaticVoidMethod(env, mActivityClass, mid, jdest);
              (*env)->DeleteLocalRef(env, jdest);
          }

          '''
          c.write_text(s.replace(marker, code + marker))
          EOF
          $NDK/ndk-build NDK_PROJECT_PATH=null APP_BUILD_SCRIPT=./Android.mk \
            APP_PLATFORM=android-24 APP_ABI=armeabi-v7a \
            NDK_OUT=$PWD/obj NDK_LIBS_OUT=$PWD/libs -j$(nproc) > /dev/null 2>&1
          cp libs/armeabi-v7a/libSDL2.so $W/lib/sdl2/android/armeabi-v7a/
          ls -l $W/lib/*/android/armeabi-v7a/

      - name: Parchear configuracion para 32 bits
        run: |
          cat > platform/app/jni/update_checker_stub.c << 'EOF'
          #include <stdbool.h>
          bool gUpdateMessage = false;
          void show_update_popup(void) {}
          void check_for_updates(void) {}
          EOF
          python3 - << 'EOF'
          import re, pathlib
          p = pathlib.Path('Android.mk'); s = p.read_text()
          s = s.replace('ifeq ($(TARGET_ARCH_ABI),arm64-v8a)', 'ifneq ($(filter arm64-v8a armeabi-v7a,$(TARGET_ARCH_ABI)),)')
          s = re.sub(r'# Curl\ninclude \$\(CLEAR_VARS\)\nLOCAL_MODULE := curl\n.*?PREBUILT_SHARED_LIBRARY\)\n', '', s, flags=re.S)
          s = s.replace('LOCAL_SHARED_LIBRARIES := sdl2 curl', 'LOCAL_SHARED_LIBRARIES := sdl2')
          old = 'C_FILES := $(filter-out $(LOCAL_PATH)/src/game/main.c,$(C_FILES))'
          new = 'C_FILES := $(filter-out $(LOCAL_PATH)/src/game/main.c $(LOCAL_PATH)/src/pc/update_checker.c,$(C_FILES))\nC_FILES += $(LOCAL_PATH)/platform/app/jni/update_checker_stub.c'
          assert old in s
          s = s.replace(old, new)
          p.write_text(s)
          for f, a, b in [('platform/app/jni/Application.mk', 'APP_ABI := arm64-v8a x86_64', 'APP_ABI := armeabi-v7a'),
                          ('platform/app/build.gradle', "abiFilters 'arm64-v8a', 'x86_64'", "abiFilters 'armeabi-v7a'")]:
              q = pathlib.Path(f); t = q.read_text(); assert a in t; q.write_text(t.replace(a, b))
          EOF
          sed -i '/^ *"curl",$/d' platform/app/src/main/java/org/libsdl/app/SDLActivity.java
          python3 - << 'PYEOF'
          import pathlib
          p = pathlib.Path('src/pc/crash_handler.c'); t = p.read_text()
          old = 'SetUnhandledExceptionFilter(crash_handler);\n#elif __linux__'
          assert t.count(old) == 1
          p.write_text(t.replace(old, 'SetUnhandledExceptionFilter(crash_handler);\n#elif __linux__ && !defined(TARGET_ANDROID)'))
          PYEOF
          sed -i 's|^C_FILES += \$(LOCAL_PATH)/platform/app/jni/update_checker_stub.c$|&\nC_FILES += $(LOCAL_PATH)/platform/app/jni/crash_log.c|' Android.mk
          grep -n "crash_log" Android.mk
          grep -n "elif __linux__" src/pc/crash_handler.c
          cat > platform/app/jni/crash_log.c << 'CRASHC'
          #define _GNU_SOURCE
          #include <signal.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <dlfcn.h>
          #include <pthread.h>
          #include <ucontext.h>
          #include <sys/prctl.h>
          #include <sys/syscall.h>

          #define CL_DIR "/storage/emulated/0/com.maniscat2.sm64coopdx/"

          typedef struct { uintptr_t lo, hi; } ClRange;
          static ClRange sExec[768];
          static int sExecCount = 0;
          static char sMaps[300000];
          static struct sigaction sOld[40];

          static void cl_put(int fd, const char *s) { if (fd >= 0) { (void) !write(fd, s, strlen(s)); } }

          static int cl_is_exec(uintptr_t a) {
              for (int i = 0; i < sExecCount; i++) { if (a >= sExec[i].lo && a < sExec[i].hi) return 1; }
              return 0;
          }

          static void cl_load_maps(void) {
              int mf = open("/proc/self/maps", O_RDONLY);
              if (mf < 0) return;
              ssize_t total = 0, n;
              while (total < (ssize_t) sizeof(sMaps) - 1 && (n = read(mf, sMaps + total, sizeof(sMaps) - 1 - total)) > 0) total += n;
              close(mf);
              sMaps[total] = 0;
              char *line = sMaps;
              while (*line && sExecCount < 768) {
                  char *end = strchr(line, '\n');
                  if (end) *end = 0;
                  char *p;
                  uintptr_t lo = strtoul(line, &p, 16);
                  if (*p == '-') {
                      uintptr_t hi = strtoul(p + 1, &p, 16);
                      while (*p == ' ') p++;
                      if (p[0] == 'r' && p[2] == 'x') { sExec[sExecCount].lo = lo; sExec[sExecCount].hi = hi; sExecCount++; }
                  }
                  if (!end) break;
                  line = end + 1;
              }
          }

          static void cl_addr(int fd, const char *label, uintptr_t a) {
              Dl_info di; char b[600];
              if (dladdr((void *) a, &di) && di.dli_fname) {
                  const char *f = strrchr(di.dli_fname, '/'); f = f ? f + 1 : di.dli_fname;
                  snprintf(b, sizeof b, "%s %08lx %s!%s+%lx [off %lx]\n", label, (unsigned long) a, f,
                      di.dli_sname ? di.dli_sname : "?",
                      di.dli_sname ? (unsigned long) (a - (uintptr_t) di.dli_saddr) : 0UL,
                      (unsigned long) (a - (uintptr_t) di.dli_fbase));
              } else {
                  snprintf(b, sizeof b, "%s %08lx (sin simbolo)\n", label, (unsigned long) a);
              }
              cl_put(fd, b);
          }

          static void cl_handler(int sig, siginfo_t *si, void *ctx) {
              char b[300]; char name[32] = {0};
              int fd = open(CL_DIR "crash_native.txt", O_WRONLY | O_CREAT | O_TRUNC, 0644);
              if (fd < 0) fd = open("/sdcard/crash_native.txt", O_WRONLY | O_CREAT | O_TRUNC, 0644);
              prctl(PR_GET_NAME, (unsigned long) name, 0, 0, 0);
              snprintf(b, sizeof b, "SENAL %d code %d fault_addr %08lx pid %d tid %d hilo '%s'\n", sig, si->si_code,
                  (unsigned long) si->si_addr, (int) getpid(), (int) syscall(__NR_gettid), name);
              cl_put(fd, b);
          #if defined(__arm__)
              ucontext_t *uc = (ucontext_t *) ctx;
              unsigned long *r = &uc->uc_mcontext.arm_r0;
              cl_load_maps();
              for (int i = 0; i < 16; i++) {
                  snprintf(b, sizeof b, "r%d=%08lx%s", i, r[i], (i % 4 == 3) ? "\n" : " ");
                  cl_put(fd, b);
              }
              cl_addr(fd, "PC", uc->uc_mcontext.arm_pc);
              cl_addr(fd, "LR", uc->uc_mcontext.arm_lr);
              cl_put(fd, "--- pila (candidatos) ---\n");
              uintptr_t top = 0; pthread_attr_t at; void *sa; size_t ss;
              if (pthread_getattr_np(pthread_self(), &at) == 0) { pthread_attr_getstack(&at, &sa, &ss); top = (uintptr_t) sa + ss; }
              uintptr_t *sp = (uintptr_t *) uc->uc_mcontext.arm_sp;
              int shown = 0;
              for (int i = 0; top && (uintptr_t) (sp + i) < top && i < 6000 && shown < 70; i++) {
                  uintptr_t w = sp[i];
                  if (cl_is_exec(w)) { snprintf(b, sizeof b, "#%d", shown); cl_addr(fd, b, w); shown++; }
              }
          #endif
              if (fd >= 0) close(fd);
              sigaction(sig, &sOld[sig], NULL);
              if (sig == SIGABRT) raise(sig);
          }

          __attribute__((constructor)) static void cl_init(void) {
              int lf = open(CL_DIR "game_log.txt", O_WRONLY | O_CREAT | O_TRUNC, 0644);
              if (lf >= 0) {
                  dup2(lf, 1); dup2(lf, 2); close(lf);
                  setvbuf(stdout, NULL, _IOLBF, 0);
                  setvbuf(stderr, NULL, _IONBF, 0);
              }
              struct sigaction sa;
              memset(&sa, 0, sizeof sa);
              sa.sa_sigaction = cl_handler;
              sigemptyset(&sa.sa_mask);
              sa.sa_flags = SA_SIGINFO;
              int sigs[] = { SIGSEGV, SIGBUS, SIGILL, SIGFPE, SIGABRT, SIGTRAP };
              for (int i = 0; i < 6; i++) { sigaction(sigs[i], &sa, &sOld[sigs[i]]); }
          }
          CRASHC
          cat > platform/app/src/main/java/com/maniscat2/sm64coopdx/sm64coopdxActivity.java << 'JAVAEOF'
          package com.maniscat2.sm64coopdx;

          import android.os.Bundle;
          import org.libsdl.app.SDLActivity;
          import java.io.FileOutputStream;
          import java.io.PrintWriter;
          import java.io.StringWriter;

          public class sm64coopdxActivity extends SDLActivity
          {
              private static final String DIR = "/storage/emulated/0/com.maniscat2.sm64coopdx/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  final Thread.UncaughtExceptionHandler prev = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                      public void uncaughtException(Thread t, Throwable e) {
                          try {
                              StringWriter sw = new StringWriter();
                              e.printStackTrace(new PrintWriter(sw));
                              FileOutputStream o = new FileOutputStream(DIR + "crash_java.txt");
                              o.write(sw.toString().getBytes());
                              o.close();
                          } catch (Throwable ignored) { }
                          if (prev != null) prev.uncaughtException(t, e);
                      }
                  });
                  super.onCreate(savedInstanceState);
              }
          }
          JAVAEOF
          sed -i 's/, sizeof(void\*))/, 8)/' src/game/memory.c
          grep -n "ALIGN_UP" src/game/memory.c
          git diff --stat

      - name: Registro de fallos - datos de memoria
        run: |
          python3 - << 'PYEOF'
          import pathlib
          p = pathlib.Path('platform/app/jni/crash_log.c'); t = p.read_text()
          a1 = 'static void cl_handler(int sig, siginfo_t *si, void *ctx) {\n'
          a2 = '    cl_put(fd, b);\n#if defined(__arm__)\n'
          assert t.count(a1) == 1 and t.count(a2) == 1
          dump = '''static void cl_dump_proc(int fd) {
              static char buf[4096];
              const char *files[2] = { "/proc/self/status", "/proc/meminfo" };
              const char *keys[2] = { "Vm", "Mem" };
              for (int k = 0; k < 2; k++) {
                  int pf = open(files[k], O_RDONLY);
                  if (pf < 0) continue;
                  ssize_t n = read(pf, buf, sizeof(buf) - 1);
                  close(pf);
                  if (n <= 0) continue;
                  buf[n] = 0;
                  cl_put(fd, k == 0 ? "--- memoria del proceso ---\\n" : "--- memoria del sistema ---\\n");
                  char *line = buf;
                  while (*line) {
                      char *end = strchr(line, '\\n');
                      if (end) *end = 0;
                      if (strncmp(line, keys[k], strlen(keys[k])) == 0 || (k == 0 && strncmp(line, "Threads", 7) == 0)) {
                          cl_put(fd, line);
                          cl_put(fd, "\\n");
                      }
                      if (!end) break;
                      line = end + 1;
                  }
              }
          }

          '''
          t = t.replace(a1, dump + a1)
          t = t.replace(a2, '    cl_put(fd, b);\n    cl_dump_proc(fd);\n#if defined(__arm__)\n')
          p.write_text(t)
          PYEOF


      
      - name: Parche del joystick tactil
        run: |
          python3 - << 'PYJOY'
          import pathlib
          p = pathlib.Path('src/pc/controller/controller_touchscreen.c'); t = p.read_text()

          old1 = ("            size = configControlElements[i].size * 100;\n"
                  "            if (!TRIGGER_DETECT(size)) continue;\n")
          new1 = ("            size = configControlElements[i].size * 100;\n"
                  "            // la base del joystick se dibuja ~2.5 veces mas grande que su zona tactil original\n"
                  "            s32 hitSize = (controlElements[i].type == Joystick) ? size * 2 : size;\n"
                  "            if (!TRIGGER_DETECT(hitSize)) continue;\n")
          assert t.count(old1) == 1
          t = t.replace(old1, new1)

          old2 = ("                        controlElements[i].joyX = CORRECT_TOUCH_X(event->x) - pos.x;\n"
                  "                        controlElements[i].joyY = CORRECT_TOUCH_Y(event->y) - pos.y;\n")
          new2 = ("                        controlElements[i].joyX = touch_clamp(CORRECT_TOUCH_X(event->x) - pos.x, -size / 2, size / 2);\n"
                  "                        controlElements[i].joyY = touch_clamp(CORRECT_TOUCH_Y(event->y) - pos.y, -size / 2, size / 2);\n")
          assert t.count(old2) == 1
          t = t.replace(old2, new2)

          old3 = "void touch_down(struct TouchEvent* event) {\n"
          new3 = ("static s32 touch_clamp(s32 v, s32 lo, s32 hi) {\n"
                  "    return (v < lo) ? lo : ((v > hi) ? hi : v);\n"
                  "}\n\n" + old3)
          assert t.count(old3) == 1
          t = t.replace(old3, new3)
          p.write_text(t)
          PYJOY
          git diff --stat src/pc/controller/controller_touchscreen.c

      - name: Registro de rendimiento (perflog)
        if: ${{ inputs.perflog }}
        run: |
          python3 - << 'PYEOF'
          import pathlib

          def patch(path, old, new):
              p = pathlib.Path(path); t = p.read_text()
              assert t.count(old) == 1, (path, old[:50])
              p.write_text(t.replace(old, new))

          patch('src/pc/gfx/gfx_pc.c',
                'static void gfx_flush(void) {\n    if (buf_vbo_len > 0) {\n        gfx_rapi->draw_triangles(buf_vbo, buf_vbo_len, buf_vbo_num_tris);\n',
                'f64 clock_elapsed_f64(void);\nf64 gDbgFlushTime = 0;\nu32 gDbgDraws = 0;\nu32 gDbgTris = 0;\n\n'
                'static void gfx_flush(void) {\n    if (buf_vbo_len > 0) {\n        gDbgDraws++;\n        gDbgTris += (u32) buf_vbo_num_tris;\n'
                '        f64 flushT0 = clock_elapsed_f64();\n'
                '        gfx_rapi->draw_triangles(buf_vbo, buf_vbo_len, buf_vbo_num_tris);\n'
                '        gDbgFlushTime += clock_elapsed_f64() - flushT0;\n')

          patch('src/pc/pc_main.c',
                '#include "pc/utils/misc.h"\n',
                '#include "pc/utils/misc.h"\n\n'
                'extern f64 gDbgFlushTime;\nextern u32 gDbgDraws;\nextern u32 gDbgTris;\n'
                'static f64 sPerfStart = 0, sPerfRun = 0, sPerfSwap = 0, sPerfGame = 0;\n'
                'static u32 sPerfFrames = 0, sPerfTicks = 0;\n')

          patch('src/pc/pc_main.c',
                '        send_display_list(gGfxSPTask);\n        gfx_end_frame_render();\n        gfx_display_frame();\n',
                '        f64 perfT0 = clock_elapsed_f64();\n'
                '        send_display_list(gGfxSPTask);\n'
                '        f64 perfT1 = clock_elapsed_f64();\n'
                '        gfx_end_frame_render();\n        gfx_display_frame();\n'
                '        f64 perfT2 = clock_elapsed_f64();\n'
                '        sPerfFrames++;\n        sPerfRun += perfT1 - perfT0;\n        sPerfSwap += perfT2 - perfT1;\n')

          patch('src/pc/pc_main.c',
                '    CTX_EXTENT(CTX_GAME_LOOP, game_loop_one_iteration);\n',
                '    f64 perfG0 = clock_elapsed_f64();\n'
                '    CTX_EXTENT(CTX_GAME_LOOP, game_loop_one_iteration);\n'
                '    sPerfGame += clock_elapsed_f64() - perfG0;\n'
                '    sPerfTicks++;\n')

          patch('src/pc/pc_main.c',
                '    // compute and update the frame rate every second\n',
                '    {\n'
                '        f64 perfNow = clock_elapsed_f64();\n'
                '        if (sPerfStart == 0) {\n'
                '            sPerfStart = perfNow;\n'
                '        } else if (perfNow - sPerfStart >= 1.0 && sPerfFrames > 0 && sPerfTicks > 0) {\n'
                '            printf("PERF %.1fs frames=%u ticks=%u | por fotograma: gfxrun=%.2fms flush=%.2fms swap=%.2fms draws=%.0f tris=%.0f | por tick: game=%.2fms\\n",\n'
                '                perfNow - sPerfStart, sPerfFrames, sPerfTicks,\n'
                '                sPerfRun * 1000.0 / sPerfFrames, gDbgFlushTime * 1000.0 / sPerfFrames, sPerfSwap * 1000.0 / sPerfFrames,\n'
                '                (f64) gDbgDraws / sPerfFrames, (f64) gDbgTris / sPerfFrames, sPerfGame * 1000.0 / sPerfTicks);\n'
                '            fflush(stdout);\n'
                '            sPerfStart = perfNow;\n'
                '            sPerfRun = 0; sPerfSwap = 0; sPerfGame = 0;\n'
                '            sPerfFrames = 0; sPerfTicks = 0;\n'
                '            gDbgFlushTime = 0; gDbgDraws = 0; gDbgTris = 0;\n'
                '        }\n'
                '    }\n\n'
                '    // compute and update the frame rate every second\n')
          PYEOF
          git diff --stat

      - name: Optimizacion - subida de vertices con buffer persistente
        run: |
          python3 - << 'PYEOF'
          import os, pathlib

          def patch(path, old, new):
              p = pathlib.Path(path); t = p.read_text()
              assert t.count(old) == 1, (path, old[:50])
              p.write_text(t.replace(old, new))

          F = 'src/pc/gfx/gfx_opengl.c'
          APP = os.environ.get('APP_ID', 'com.maniscat2.sm64coopdx')

          patch(F, '#include <stdint.h>\n#include <stdbool.h>\n',
                   '#include <stdint.h>\n#include <stdbool.h>\n#include <stdio.h>\n#include <string.h>\n')

          patch(F, 'static void gfx_opengl_draw_triangles(float buf_vbo[], size_t buf_vbo_len, size_t buf_vbo_num_tris) {\n'
                   '    //printf("flushing %d tris\\n", buf_vbo_num_tris);\n'
                   '    glBufferData(GL_ARRAY_BUFFER, sizeof(float) * buf_vbo_len, buf_vbo, GL_STREAM_DRAW);\n'
                   '    glDrawArrays(GL_TRIANGLES, 0, 3 * buf_vbo_num_tris);\n}\n',
                   '// Subida de vertices con un buffer en anillo de memoria mapeada persistente (GL_EXT_buffer_storage).\n'
                   '// Evita reservar un buffer nuevo (glBufferData) en cada llamada de dibujo, lo que en algunos\n'
                   '// controladores moviles (p. ej. PowerVR) es muy caro. Si la extension no esta disponible, o si existe\n'
                   '// el archivo legacy_upload.txt en la carpeta del juego, se usa el metodo clasico.\n'
                   '#define RING_SIZE (8 * 1024 * 1024)\n'
                   'typedef void (*GfxBufferStorageFn)(GLenum, GLsizeiptr, const void *, GLbitfield);\n'
                   'static bool sRingInitTried = false;\n'
                   'static GLuint sRingVbo = 0;\n'
                   'static uint8_t *sRingPtr = NULL;\n'
                   'static size_t sRingOffset = 0;\n\n'
                   'static void gfx_opengl_ring_init(void) {\n'
                   '    sRingInitTried = true;\n'
                   '    FILE *f = fopen("/storage/emulated/0/' + APP + '/legacy_upload.txt", "r");\n'
                   '    if (f != NULL) {\n'
                   '        fclose(f);\n'
                   '        printf("UPLOAD clasico (forzado por legacy_upload.txt)\\n");\n'
                   '        fflush(stdout);\n'
                   '        return;\n'
                   '    }\n'
                   '    const char *ext = (const char *) glGetString(GL_EXTENSIONS);\n'
                   '    GfxBufferStorageFn storage = NULL;\n'
                   '    if (ext != NULL && strstr(ext, "GL_EXT_buffer_storage") != NULL) {\n'
                   '        storage = (GfxBufferStorageFn) SDL_GL_GetProcAddress("glBufferStorageEXT");\n'
                   '    }\n'
                   '    if (storage == NULL) {\n'
                   '        printf("UPLOAD clasico (GL_EXT_buffer_storage no disponible)\\n");\n'
                   '        fflush(stdout);\n'
                   '        return;\n'
                   '    }\n'
                   '    GLuint vbo = 0;\n'
                   '    glGenBuffers(1, &vbo);\n'
                   '    glBindBuffer(GL_ARRAY_BUFFER, vbo);\n'
                   '    storage(GL_ARRAY_BUFFER, RING_SIZE, NULL, 0x0002 | 0x0040 | 0x0080);\n'
                   '    uint8_t *ptr = (uint8_t *) glMapBufferRange(GL_ARRAY_BUFFER, 0, RING_SIZE, 0x0002 | 0x0040 | 0x0080);\n'
                   '    if (ptr == NULL) {\n'
                   '        glBindBuffer(GL_ARRAY_BUFFER, opengl_vbo);\n'
                   '        glDeleteBuffers(1, &vbo);\n'
                   '        printf("UPLOAD clasico (no se pudo mapear el buffer persistente)\\n");\n'
                   '        fflush(stdout);\n'
                   '        return;\n'
                   '    }\n'
                   '    sRingVbo = vbo;\n'
                   '    sRingPtr = ptr;\n'
                   '    sRingOffset = 0;\n'
                   '    if (opengl_prg != NULL) { gfx_opengl_vertex_array_set_attribs(opengl_prg); }\n'
                   '    printf("UPLOAD persistente activo (anillo de %d MB)\\n", RING_SIZE / (1024 * 1024));\n'
                   '    fflush(stdout);\n'
                   '}\n\n'
                   'static void gfx_opengl_draw_triangles(float buf_vbo[], size_t buf_vbo_len, size_t buf_vbo_num_tris) {\n'
                   '    if (!sRingInitTried) { gfx_opengl_ring_init(); }\n'
                   '    if (sRingPtr == NULL) {\n'
                   '        glBufferData(GL_ARRAY_BUFFER, sizeof(float) * buf_vbo_len, buf_vbo, GL_STREAM_DRAW);\n'
                   '        glDrawArrays(GL_TRIANGLES, 0, 3 * buf_vbo_num_tris);\n'
                   '        return;\n'
                   '    }\n'
                   '    size_t bytes = sizeof(float) * buf_vbo_len;\n'
                   '    size_t verts = 3 * buf_vbo_num_tris;\n'
                   '    size_t stride = bytes / verts;\n'
                   '    size_t off = ((sRingOffset + stride - 1) / stride) * stride;\n'
                   '    if (off + bytes > RING_SIZE) { off = 0; }\n'
                   '    memcpy(sRingPtr + off, buf_vbo, bytes);\n'
                   '    glDrawArrays(GL_TRIANGLES, off / stride, verts);\n'
                   '    sRingOffset = off + bytes;\n'
                   '}\n')

          patch(F, '    glGenBuffers(1, &opengl_vbo);\n\n    glBindBuffer(GL_ARRAY_BUFFER, opengl_vbo);\n',
                   '    sRingInitTried = false;\n    sRingVbo = 0;\n    sRingPtr = NULL;\n    sRingOffset = 0;\n\n'
                   '    glGenBuffers(1, &opengl_vbo);\n\n    glBindBuffer(GL_ARRAY_BUFFER, opengl_vbo);\n')
          PYEOF
          git diff --stat src/pc/gfx/gfx_opengl.c

      - name: Prueba de agua - viewport 1x1 y sin mezclado (perflog)
        if: ${{ inputs.perflog }}
        run: |
          python3 - << 'PYEOF'
          import pathlib

          def patch(path, old, new):
              p = pathlib.Path(path); t = p.read_text()
              assert t.count(old) == 1, (path, old[:60])
              p.write_text(t.replace(old, new))

          F = 'src/pc/gfx/gfx_opengl.c'

          # viewport vigente (para restaurarlo tras un dibujo con viewport reducido)
          patch(F, 'static void gfx_opengl_set_viewport(int x, int y, int width, int height) {\n    glViewport(x, y, width, height);\n}\n',
                   'static int sVpX = 0, sVpY = 0, sVpW = 1, sVpH = 1;\n\n'
                   'static void gfx_opengl_set_viewport(int x, int y, int width, int height) {\n'
                   '    sVpX = x; sVpY = y; sVpW = width; sVpH = height;\n'
                   '    glViewport(x, y, width, height);\n}\n')

          # ciclo de pruebas + mezclado de transparencias
          patch(F, 'static void gfx_opengl_set_use_alpha(bool use_alpha) {\n'
                   '    if (use_alpha) {\n'
                   '        glEnable(GL_BLEND);\n'
                   '    } else {\n'
                   '        glDisable(GL_BLEND);\n'
                   '    }\n'
                   '}\n',
                   '// perf_mode.txt: segundos (desde que se abre la app) tras los cuales empieza un ciclo de 20 s por paso:\n'
                   '// 0 normal, 1 viewport de 1x1 (se quita el trabajo de relleno), 2 sin mezclado de transparencias. Despues vuelve al 0.\n'
                   'static bool sLastAlpha = false;\n'
                   'static int sWStart = -2;\n'
                   'static int sWPrev = -1;\n\n'
                   'static int gfx_opengl_wmode(void) {\n'
                   '    if (sWStart == -2) {\n'
                   '        sWStart = -1;\n'
                   '        FILE *f = fopen("/storage/emulated/0/com.maniscat2.sm64coopdx/perf_mode.txt", "r");\n'
                   '        if (f) {\n'
                   '            int s = 0;\n'
                   '            if (fscanf(f, "%d", &s) == 1 && s >= 0) { sWStart = s; }\n'
                   '            fclose(f);\n'
                   '        }\n'
                   '        printf("WCICLO inicio=%d s (-1 = desactivado); 20 s por paso: 0 normal, 1 viewport 1x1, 2 sin mezclado\\n", sWStart);\n'
                   '        fflush(stdout);\n'
                   '    }\n'
                   '    int mode = 0;\n'
                   '    unsigned int t = SDL_GetTicks() / 1000;\n'
                   '    if (sWStart >= 0 && t >= (unsigned int) sWStart) {\n'
                   '        unsigned int step = (t - (unsigned int) sWStart) / 20;\n'
                   '        if (step <= 2) { mode = (int) step; }\n'
                   '    }\n'
                   '    if (mode != sWPrev) {\n'
                   '        printf("WMODE %d t=%us\\n", mode, t);\n'
                   '        fflush(stdout);\n'
                   '        sWPrev = mode;\n'
                   '        if (sLastAlpha && mode != 2) { glEnable(GL_BLEND); } else { glDisable(GL_BLEND); }\n'
                   '    }\n'
                   '    return mode;\n'
                   '}\n\n'
                   'static void gfx_opengl_set_use_alpha(bool use_alpha) {\n'
                   '    sLastAlpha = use_alpha;\n'
                   '    if (use_alpha && gfx_opengl_wmode() != 2) {\n'
                   '        glEnable(GL_BLEND);\n'
                   '    } else {\n'
                   '        glDisable(GL_BLEND);\n'
                   '    }\n'
                   '}\n')

          patch(F, '    glDrawArrays(GL_TRIANGLES, off / stride, verts);\n    sRingOffset = off + bytes;\n}\n',
                   '    int wm = gfx_opengl_wmode();\n'
                   '    if (wm == 1) { glViewport(0, 0, 1, 1); }\n'
                   '    glDrawArrays(GL_TRIANGLES, off / stride, verts);\n'
                   '    if (wm == 1) { glViewport(sVpX, sVpY, sVpW, sVpH); }\n'
                   '    sRingOffset = off + bytes;\n}\n')
          PYEOF
          git diff --stat src/pc/gfx/gfx_opengl.c
          
      - name: Make del host (genera archivos del juego)
        run: |
          make -j$(nproc) TOUCH_CONTROLS=1 > make.log 2>&1 || {
            echo "=== ERRORES ==="; grep -n -E "error|\*\*\*" make.log | head -30
            echo "=== FINAL ==="; tail -20 make.log; exit 1; }

      - name: Convertir datos de sonido a 32 bits
        run: |
          SD=$(dirname $(find build -name sound_data.ctl | head -1))
          echo "Carpeta de sonido: $SD"
          python3 tools/convert_sound_32.py "$SD"

      - name: Variantes de optimizacion
        run: |
          if [ "${{ inputs.neon }}" = "true" ]; then sed -i '/^LOCAL_CFLAGS := /a LOCAL_ARM_NEON := true' Android.mk; fi
          if [ "${{ inputs.modo_arm }}" = "true" ]; then sed -i '/^LOCAL_CFLAGS := /a LOCAL_ARM_MODE := arm' Android.mk; fi
          grep -n "LOCAL_ARM" Android.mk || echo "sin variantes"

      - name: Variante de diagnostico (perfilador)
        if: ${{ inputs.diagnostico }}
        run: |
          sed -i 's/^LOCAL_CFLAGS := /LOCAL_CFLAGS := -DDEVELOPMENT /' Android.mk
          grep -n "^LOCAL_CFLAGS := -DDEVELOPMENT" Android.mk | cut -c1-60

      - name: Contadores extra de render (diagnostico)
        if: ${{ inputs.diagnostico }}
        run: |
          python3 - << 'PYEOF'
          import pathlib

          def patch(path, old, new):
              p = pathlib.Path(path); t = p.read_text()
              assert t.count(old) == 1, (path, old[:40])
              p.write_text(t.replace(old, new))

          patch('src/pc/debug_context.h',
                '    CTX_LIGHTING,\n    CTX_MAX,\n',
                '    CTX_LIGHTING,\n    CTX_GFX_RUN,\n    CTX_GFX_SWAP,\n    CTX_GFX_FLUSH,\n    CTX_N_DRAWS,\n    CTX_N_TRIS,\n    CTX_MAX,\n')
          patch('src/pc/djui/djui_ctx_display.c',
                '    "LIGHTING",\n    "OTHER",\n',
                '    "LIGHTING",\n    "GFXRUN",\n    "SWAP",\n    "GFXFLUSH",\n    "NDRAWS",\n    "NTRIS",\n    "OTHER",\n')
          patch('src/pc/pc_main.c',
                '        send_display_list(gGfxSPTask);\n        gfx_end_frame_render();\n        gfx_display_frame();\n',
                '        CTX_BEGIN(CTX_GFX_RUN);\n        send_display_list(gGfxSPTask);\n        CTX_END(CTX_GFX_RUN);\n'
                '        CTX_BEGIN(CTX_GFX_SWAP);\n        gfx_end_frame_render();\n        gfx_display_frame();\n        CTX_END(CTX_GFX_SWAP);\n')
          patch('src/pc/gfx/gfx_pc.c',
                'static void gfx_flush(void) {\n    if (buf_vbo_len > 0) {\n        gfx_rapi->draw_triangles(buf_vbo, buf_vbo_len, buf_vbo_num_tris);\n',
                'static u32 sDbgDraws = 0;\nstatic u32 sDbgTris = 0;\n\n'
                'static void gfx_flush(void) {\n    if (buf_vbo_len > 0) {\n        sDbgDraws++;\n        sDbgTris += (u32) buf_vbo_num_tris;\n'
                '        CTX_BEGIN(CTX_GFX_FLUSH);\n        gfx_rapi->draw_triangles(buf_vbo, buf_vbo_len, buf_vbo_num_tris);\n        CTX_END(CTX_GFX_FLUSH);\n')
          patch('src/pc/gfx/gfx_pc.c',
                '    gfx_rapi->start_frame();\n    gfx_run_dl(commands);\n}\n',
                '    gfx_rapi->start_frame();\n    gfx_run_dl(commands);\n'
                '    debug_context_set_time(CTX_N_DRAWS, (sDbgDraws + 0.5) * 1e-6);\n'
                '    debug_context_set_time(CTX_N_TRIS, (sDbgTris + 0.5) * 1e-6);\n'
                '    sDbgDraws = 0;\n    sDbgTris = 0;\n}\n')
          patch('src/pc/djui/djui_ctx_display.c',
                '        s32 counterMs = (s32)(debug_context_get_time(i) * 1000000.0);\n',
                '        static f64 sSmooth[CTX_MAX] = { 0 };\n'
                '        sSmooth[i] = sSmooth[i] * 0.95 + debug_context_get_time(i) * 0.05;\n'
                '        s32 counterMs = (s32)(sSmooth[i] * 1000000.0);\n')
          PYEOF
          git diff --stat

      
      - name: Gradle (APK de 32 bits)
        run: |
          chmod +x platform/gradlew
          ./platform/gradlew assembleRelease > gradle.log 2>&1 || {
            echo "=== ERRORES ==="; grep -n -E "error:|undefined|FAILED|What went wrong|Execution failed" gradle.log | head -40
            echo "=== FINAL ==="; tail -30 gradle.log; exit 1; }
          apksigner sign --key platform/android/key.pk8 --cert platform/android/certificate.pem \
            platform/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p out && cp platform/app/build/outputs/apk/release/app-release-unsigned.apk out/sm64coopdx_armv7.apk
          unzip -l out/sm64coopdx_armv7.apk | grep -E "lib/|\.so"

      - uses: actions/upload-artifact@v4
        with:
          name: sm64coopdx-armv7-apk
          path: out/sm64coopdx_armv7.apk
